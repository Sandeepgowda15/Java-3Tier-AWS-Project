name: Java Application CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Java Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Java-Login-App

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test

      - name: Build WAR
        run: ./mvnw clean package -DskipTests

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: javaloginapp-war
          path: Java-Login-App/target/*.war
