name: Java Application CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      version:
        description: "Application version to deploy"
        required: true
        default: "v1.0"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    name: Build and Test Java Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Java-Login-App

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test

      - name: Build WAR
        run: ./mvnw clean package -DskipTests

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: javaloginapp-war
          path: Java-Login-App/target/*.war

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::089783390772:role/github-actions-java-3tier-deploy-role
          role-session-name: GitHubActions-Java3Tier
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy application
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Deploying application version: $VERSION"

          aws s3 cp \
            Java-Login-App/target/*.war \
            s3://java-3tier-app-deploy-089783390772/releases/$VERSION/javaloginapp.war

          aws s3 cp \
            Java-Login-App/target/*.war \
            s3://java-3tier-app-deploy-089783390772/current/javaloginapp.war

          echo "Application uploaded to S3"

          COMMAND_ID=$(aws ssm send-command \
            --region us-east-1 \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Project,Values=java-3tier-app" "Key=tag:Tier,Values=application" \
            --parameters 'commands=[
              "set -e",
              "echo Deploying application...",
              "aws s3 cp s3://java-3tier-app-deploy-089783390772/releases/'"$VERSION"'/javaloginapp.war /tmp/javaloginapp.war",
              "rm -rf /opt/tomcat11/webapps/javaloginapp",
              "rm -f /opt/tomcat11/webapps/javaloginapp.war",
              "cp /tmp/javaloginapp.war /opt/tomcat11/webapps/javaloginapp.war",
              "chown tomcat11:tomcat11 /opt/tomcat11/webapps/javaloginapp.war",
              "systemctl restart tomcat11",
              "sleep 10",
              "systemctl is-active --quiet tomcat11",
              "echo Deployment completed successfully"
            ]' \
            --comment "Deploy Java Login Application $VERSION" \
            --max-concurrency "1" \
            --max-errors "0" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          EXPECTED_COUNT=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names java-3tier-app-asg \
            --query 'AutoScalingGroups[0].DesiredCapacity' \
            --output text)

          echo "Expected application instances: $EXPECTED_COUNT"

          START_TIME=$(date +%s)
          TIMEOUT_SECONDS=600

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))

            if [ "$ELAPSED" -ge "$TIMEOUT_SECONDS" ]; then
              echo "Deployment timed out after 10 minutes"

              aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --details \
                --query 'CommandInvocations[*].[InstanceId,Status,StatusDetails]' \
                --output table

              exit 1
            fi

            INVOCATION_COUNT=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --query 'length(CommandInvocations)' \
              --output text)

            echo "SSM invocations: $INVOCATION_COUNT/$EXPECTED_COUNT"

            if [ "$INVOCATION_COUNT" -ge "$EXPECTED_COUNT" ]; then

              STATUSES=$(aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --query 'CommandInvocations[*].Status' \
                --output text)

              echo "Current statuses: $STATUSES"

              if echo "$STATUSES" | grep -Eq 'Failed|Cancelled|TimedOut|Cancelling|Delivery Timed Out'; then
                echo "One or more SSM deployments failed"

                aws ssm list-command-invocations \
                  --command-id "$COMMAND_ID" \
                  --details \
                  --query 'CommandInvocations[*].[InstanceId,Status,StatusDetails]' \
                  --output table

                exit 1
              fi

              SUCCESS_COUNT=$(aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --query 'length(CommandInvocations[?Status==`Success`])' \
                --output text)

              echo "Successful deployments: $SUCCESS_COUNT/$EXPECTED_COUNT"

              if [ "$SUCCESS_COUNT" -eq "$EXPECTED_COUNT" ]; then
                echo "Deployment completed successfully on all application instances"
                break
              fi
            fi

            sleep 10
          done
