name: Java Application CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      version:
        description: "Application version to deploy"
        required: true
        default: "v1.0"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    name: Build and Test Java Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Java-Login-App

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test

      - name: Build WAR
        run: ./mvnw clean package -DskipTests

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: javaloginapp-war
          path: Java-Login-App/target/*.war

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::089783390772:role/github-actions-java-3tier-deploy-role
          role-session-name: GitHubActions-Java3Tier
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy application
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Deploying application version: $VERSION"

          aws s3 cp \
            Java-Login-App/target/*.war \
            s3://java-3tier-app-deploy-089783390772/releases/$VERSION/javaloginapp.war

            aws s3 cp \
            Java-Login-App/target/*.war \
            s3://java-3tier-app-deploy-089783390772/current/javaloginapp.war

          echo "Application uploaded to S3"

          COMMAND_ID=$(aws ssm send-command \
            --region us-east-1 \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Project,Values=java-3tier-app" "Key=tag:Tier,Values=application" \
            --parameters 'commands=[
              "set -e",
              "echo Deploying application...",
              "aws s3 cp s3://java-3tier-app-deploy-089783390772/releases/'"$VERSION"'/javaloginapp.war /tmp/javaloginapp.war",
              "rm -rf /opt/tomcat11/webapps/javaloginapp",
              "rm -f /opt/tomcat11/webapps/javaloginapp.war",
              "cp /tmp/javaloginapp.war /opt/tomcat11/webapps/javaloginapp.war",
              "chown tomcat11:tomcat11 /opt/tomcat11/webapps/javaloginapp.war",
              "systemctl restart tomcat11",
              "sleep 10",
              "systemctl is-active --quiet tomcat11",
              "echo Deployment completed successfully"
            ]' \
            --comment "Deploy Java Login Application $VERSION" \
            --max-concurrency "1" \
            --max-errors "0" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0c0d6ab279b6cb817

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0e92194b41d1cdced

          echo "Deployment command completed on both application instances"
